<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ project.title }} — {{ profile.name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="site-header">
  <a class="logo" href="{{ url_for('index') }}">{{ profile.name }}</a>
  <nav class="site-nav">
    <a href="{{ url_for('index') }}">Главная</a>
  </nav>
</div>
<div class="project-detail">
  <div class="project-detail-card">
    <!-- Блок картинки -->
    <div class="project-detail-image">
      {% if project.image_url %}
      <img src="{{ project.image_url }}" alt="{{ project.title }}">
      {% else %}
      <div class="project-detail-placeholder">Нет фото</div>
      {% endif %}
    </div>
    <!-- Блок текста -->
    <div class="project-detail-info">
      <h1 class="project-detail-title">{{ project.title }}</h1>
      <p class="project-detail-desc">{{ project.description }}</p>
      <div class="project-detail-tech">
        {% for t in project.tech %}
        <span class="tech-tag">{{ t }}</span>
        {% endfor %}
      </div>
      <div class="project-detail-links">
        <a href="{{ project.github }}" target="_blank" class="btn-github">Открыть на GitHub</a>
        <a href="{{ url_for('index') }}" class="back-link">← На главную</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
